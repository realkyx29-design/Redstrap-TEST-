[package]
name = "redstrap-desktop"
version = "1.0.0"
edition = "2021"
description = "Red Strap settings app: modern red + dark desktop UI"
license = "MIT"

[[bin]]
name = "RedStrap-Settings"
path = "src/main.rs"

[dependencies]
redstrap-core = { path = "../core" }
eframe = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
rfd = { workspace = true }
tray-icon = { workspace = true }
muda = { workspace = true }
image = { workspace = true }

[build-dependencies]
embed-resource = "2.5.2"
